# Deploys on every merge to main, never from a laptop (PRD §8). Needs one repo secret,
# CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, D1: Edit, on Nick's account; the account id is in
# wrangler.jsonc). Worker secrets (the GitHub App's) are set once with `wrangler secret bulk`.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Check the Claude Code plugin and marketplace
        run: npx -y @anthropic-ai/claude-code@2.1.301 plugin validate . --strict
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npm run build
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
